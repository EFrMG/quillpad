name: CI fixture

# Opt in only the existing fixture PR's head branch.
on:
  push:
    branches:
      - fix/missing-notes-dir

permissions:
  contents: read

jobs:
  fixture-pass:
    name: Fixture / passes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit deterministic passing fixture
        shell: bash
        run: |
          printf '%s\n' 'QUILLPAD_CI_FIXTURE_PASS_BEGIN'
          printf '%s\n' 'Synthetic fixture: the passing check is expected to succeed.'
          printf '%s\n' 'QUILLPAD_CI_FIXTURE_PASS_END'
          exit 0

  fixture-fail:
    name: Fixture / fails intentionally
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit deterministic failing fixture
        shell: bash
        run: |
          printf '%s\n' 'QUILLPAD_CI_FIXTURE_FAIL_BEGIN'
          printf '%s\n' 'Synthetic fixture: the failing check is expected to fail.'
          printf '%s\n' '::error title=Intentional fixture failure::QUILLPAD_CI_FIXTURE_FAIL: expected synthetic failure for check and log testing.'
          printf '%s\n' 'QUILLPAD_CI_FIXTURE_FAIL_END'
          exit 1
